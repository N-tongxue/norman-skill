interface:
  display_name: "Norman Paper2PPT"
  short_description: "论文精读与结果导向汇报，前后概览总结各一页、核心结果多页，原图优先，整页丰满，充分解读配精美文本框，仅辅以简洁流程图"
  default_prompt: "使用 $norman-paper2ppt 制作论文汇报：每页充分利用画布，消除大块空白，适当增加证据解读，以有底色、内边距和层级的文本框提升排版，可编辑版保留样式且不增加复杂矢量化；依次确认模式、讲稿与可编辑版，复用已明确选择；读完全文后一次确定全部页面与提示词，尽量覆盖正文全部原图，页少两张相关图一页、页多一张图一页，禁止新增 AI 插画，仅辅以简洁流程图；原图通过本地保真组装置入，再以实际工具允许的有界并发生成铺满画布、逻辑清晰且精美的完整科研信息图页面、单次集中审核并合成 PPT，封面右侧展示论文首页且仅封面留水印，背景路线方法合并一页，核心结果多页，创新结论启示合并末页。"
